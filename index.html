    /* --- 顶部标题区：柔和蓝流动渐变（background-position 方式，兼容微信内置浏览器） --- */
    .header-flow {

    .header-flow::after {

      position: absolute;
      top: 0;
      bottom: 0;
      left: -45%;
      width: 40%;
      background: linear-gradient(

        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.55) 50%,

      transform: skewX(-18deg);
      pointer-events: none;
      animation: headerSheen 3.2s ease-in-out infinite;

    @keyframes headerSheen {

      55%  { left: -45%; }

    @keyframes headerFlow {

    .scene-in.delay-2 { animation-delay: 0.24s; }

    .header-flow.scene-in {

    function loadData() {
      try {
        const w = JSON.parse(localStorage.getItem(STORAGE_KEYS.workers));
        const c = JSON.parse(localStorage.getItem(STORAGE_KEYS.communities));
        if (Array.isArray(w) && w.length > 0 && Array.isArray(c) && c.length > 0) {
          WORKERS = w;
          COMMUNITIES = c;
          return;
        }
      } catch (err) {
        // 数据损坏则回退默认
      }
      WORKERS = JSON.parse(JSON.stringify(DEFAULT_WORKERS));
      COMMUNITIES = JSON.parse(JSON.stringify(DEFAULT_COMMUNITIES));
    }

    function saveData() {
      try {
        localStorage.setItem(STORAGE_KEYS.workers, JSON.stringify(WORKERS));
        localStorage.setItem(STORAGE_KEYS.communities, JSON.stringify(COMMUNITIES));
      } catch (err) {
        console.warn('数据保存失败:', err);

    // ==========================================
    // 联系方式解析
    // ==========================================
    function parseContact(contactStr) {
      // 空字符串
      if (!contactStr || contactStr.trim() === '') {
        return { type: 'none', name: '', phone: '', role: '', wechatId: '' };
      }
      
      // 提取11位手机号
      const phoneMatch = contactStr.match(/(\d{11})/);
      const phone = phoneMatch ? phoneMatch[1] : '';
      
      // 判断是否有电话号码
      if (!phone) {
        // 微信联系（无号码）
        // 提取姓名：号码前面的文字，去除括号备注
        let name = contactStr.replace(/[（(][^）)]*[）)]/g, '').trim();
        // 判断身份角色
        let role = '物业联系人';
        if (contactStr.includes('维修师傅')) {
          role = '维修师傅';
        } else if (contactStr.includes('物业负责人')) {
          role = '物业负责人';
        } else if (contactStr.includes('经理') || contactStr.includes('负责人')) {
          role = '物业负责人';
        }
        // 提取微信号：匹配 带前缀的写法
        let wechatId = '';
        const wechatMatch = contactStr.match(/(?:微信号[：:]\s*|微信[：:]\s*|wxid[:：]\s*|wx[:：]\s*)([a-zA-Z0-9_-]+)/i);
        if (wechatMatch) {
          wechatId = wechatMatch[1];
        }
        return { type: 'wechat', name, phone: '', role, wechatId };
      }
      
      // 提取联系人姓名（号码前面的文字）
      let name = contactStr.replace(/\d{11}.*$/, '').trim();
      
      // 去除括号内的备注
      name = name.replace(/[（(][^）)]*[）)]/g, '').trim();
      
      // 判断身份角色
      let role = '物业联系人';
      if (contactStr.includes('维修师傅')) {
        role = '维修师傅';
      } else if (contactStr.includes('物业负责人')) {
        role = '物业负责人';
      } else if (contactStr.includes('经理') || contactStr.includes('负责人')) {
        role = '物业负责人';
      }
      
      return { type: 'phone', name, phone, role, wechatId: '' };
    }

    // ==========================================
    // 师傅解析（workerId 关联优先，兼容旧 contact 字段）
    // ==========================================
    function getWorkerById(id) {
      if (!id) return null;
      return WORKERS.find(w => w.id === id) || null;
    }

    function getContactForCommunity(c) {
      if (c && c.workerId) {
        const w = getWorkerById(c.workerId);
        if (w) {
          // type 判定：有电话→phone；无电话有微信号→wechat(复制)；无电话无微信号但有姓名→wechat(联系专员提示)；全空→none
          let type = 'none';
          if (w.phone) type = 'phone';
          else if (w.wechatId) type = 'wechat';
          else if (w.name) type = 'wechat';
          return {
            type: type,
            name: w.name || '',
            role: w.role || '物业联系人',
            phone: w.phone || '',
            wechatId: w.wechatId || '',
            workerId: w.id,
            skills: Array.isArray(w.skills) ? w.skills : [],
            note: w.note || '',
            rating: w.rating || 0,
            ratingNote: w.ratingNote || '',
            reviews: Array.isArray(w.reviews) ? w.reviews : []
          };
        }
      }
      // 兼容旧数据（contact 文本字段）
      if (c && c.contact) {
        const p = parseContact(c.contact);
        return Object.assign({ skills: [], note: '', rating: 0, ratingNote: '' }, p);
      }
      return { type: 'none', name: '', role: '物业联系人', phone: '', wechatId: '', workerId: '', skills: [], note: '', rating: 0, ratingNote: '', reviews: [] };
    }

    // 统计师傅的评价：返回 { avg(保留1位小数), count, stars:[1..5分布] }
    function computeRating(w) {
      const reviews = (w && Array.isArray(w.reviews)) ? w.reviews.filter(r => r && r.stars >= 1 && r.stars <= 5) : [];
      if (reviews.length > 0) {
        const sum = reviews.reduce((acc, r) => acc + r.stars, 0);
        const stars = [0, 0, 0, 0, 0];
        reviews.forEach(r => { stars[r.stars - 1]++; });
        return { avg: Math.round((sum / reviews.length) * 10) / 10, count: reviews.length, stars };
      }
      // 无客户评价时回退到管理员预设 rating
      const preset = (w && w.rating) || 0;
      return { avg: preset, count: 0, stars: preset > 0 ? Array.from({ length: 5 }, (_, i) => (i < preset ? 1 : 0)) : [0,0,0,0,0] };
    }

    // ==========================================
    // 客户评价师傅（弹层）
    // ==========================================
    function openReviewModal(workerId) {
      const w = getWorkerById(workerId);
      if (!w) return;
      // 已评价过（localStorage 去重，防止刷屏）
      const reviewedKey = 'nj-repair.reviewed.' + workerId;
      const already = localStorage.getItem(reviewedKey);
      const stat = computeRating(w);

    // Haversine 距离（km）
    function haversineKm(lat1, lng1, lat2, lng2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLng = (lng2 - lng1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLng / 2) * Math.sin(dLng / 2);
      return 2 * R * Math.asin(Math.sqrt(a));
    }

    // WGS-84（浏览器 Geolocation API 返回的 GPS 坐标）→ GCJ-02（火星坐标，国内地图/TMap 标准）
    // 不转换直接渲染到 TMap 上会偏移 300~700 米，这正是"定位有偏差"的根因。
    function wgs84ToGcj02(lat, lng) {
      const a = 6378245.0;
      const ee = 0.00669342162296594323;
      const outOfChina = (la, ln) => (ln < 72.004 || ln > 137.8347 || la < 0.8293 || la > 55.8271);
      const transformLat = (x, y) => {
        let ret = -100.0 + 2.0 * x + 3.0 * y + 0.2 * y * y + 0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x));
        ret += (20.0 * Math.sin(6.0 * x * Math.PI) + 20.0 * Math.sin(2.0 * x * Math.PI)) * 2.0 / 3.0;
        ret += (20.0 * Math.sin(y * Math.PI) + 40.0 * Math.sin(y / 3.0 * Math.PI)) * 2.0 / 3.0;
        ret += (160.0 * Math.sin(y / 12.0 * Math.PI) + 320 * Math.sin(y * Math.PI / 30.0)) * 2.0 / 3.0;
        return ret;
      };
      const transformLng = (x, y) => {
        let ret = 300.0 + x + 2.0 * y + 0.1 * x * x + 0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x));
        ret += (20.0 * Math.sin(6.0 * x * Math.PI) + 20.0 * Math.sin(2.0 * x * Math.PI)) * 2.0 / 3.0;
        ret += (20.0 * Math.sin(x * Math.PI) + 40.0 * Math.sin(x / 3.0 * Math.PI)) * 2.0 / 3.0;
        ret += (150.0 * Math.sin(x / 12.0 * Math.PI) + 300.0 * Math.sin(x / 30.0 * Math.PI)) * 2.0 / 3.0;
        return ret;
      };
      if (outOfChina(lat, lng)) return { lat: lat, lng: lng };
      let dLat = transformLat(lng - 105.0, lat - 35.0);
      let dLng = transformLng(lng - 105.0, lat - 35.0);
      const radLat = lat / 180.0 * Math.PI;
      let magic = Math.sin(radLat);
      magic = 1 - ee * magic * magic;
      const sqrtMagic = Math.sqrt(magic);
      dLat = (dLat * 180.0) / ((a * (1 - ee)) / (magic * sqrtMagic) * Math.PI);
      dLng = (dLng * 180.0) / (a / sqrtMagic * Math.cos(radLat) * Math.PI);
      return { lat: lat + dLat, lng: lng + dLng };
    }

    // 根据经纬度匹配最近小区（34 个点位中取 Haversine 最小者）
    function matchCommunity(lat, lng) {
      let best = null;
      let bestDist = Infinity;
      COMMUNITY_COORDS.forEach(c => {
        const dist = haversineKm(lat, lng, c.lat, c.lng);
        if (dist < bestDist) { bestDist = dist; best = c; }
      });
      return { community: best, distKm: bestDist };
    }

    // V9: 附近小区识别半径（km）——定位后只展示 1km 内的小区候选
    const NEARBY_RADIUS_KM = 1;
    // V10: 已定位后搜索附近小区时沿用同一识别逻辑
    const SEARCH_NEARBY_RADIUS_KM = 1;

    // V9: 附近小区识别：返回按距离升序排序、且 distKm <= radiusKm 的小区数组
    //（仅用于二级选择菜单，绝不暴露 1km 半径之外的其他小区）
    function nearbyCommunities(lat, lng, radiusKm) {
      const radius = (radiusKm == null) ? NEARBY_RADIUS_KM : radiusKm;
      return COMMUNITY_COORDS
        .map(c => ({ community: c, distKm: haversineKm(lat, lng, c.lat, c.lng) }))
        .filter(item => item.distKm <= radius)
        .sort((a, b) => a.distKm - b.distKm);
    }

    // 定位/选中某个小区：高亮对应点位 + 展示唯一详情卡（并收起二级选择菜单）
    function locateToCommunity(communityId, distKm, lowAccuracy, source) {
      const c = COMMUNITIES.find(x => x.id === communityId);
      if (!c) return;
      currentDetailCommunityId = communityId;
      locatedCommunityId = communityId;
      hideNearbySelector();
      searchNearbyList = null;
      searchNearbyLowAccuracy = false;
      const resultEl = document.getElementById('locationResult');
      const searchMode = source === 'search';
      const distText = distKm != null ? '（距定位点约 ' + Math.round(distKm) + ' 公里）' : '';
      let msg = searchMode
        ? `已为您选择「${c.name}」${distText}`
        : (distKm != null
          ? `已为您定位到「${c.name}」（距您约 ${Math.round(distKm)} 公里）`
          : `已为您定位到「${c.name}」`);
      // 低精度定位时在结果旁追加提示（不阻断流程）
      if (lowAccuracy) msg += '（当前定位精度较低，结果可能有偏差）';
      resultEl.textContent = msg;

      highlightCommunityOnMap(communityId);
      renderCommunityDetail(communityId);
    }

    // 定位请求序号：防止慢回调（超时/迟到结果）覆盖新一轮定位的结果
    let locateSeq = 0;

    function realLocate() {
      const resultEl = document.getElementById('locationResult');
      const btn = document.getElementById('locateBtn');
      const seq = ++locateSeq;

      // 每次定位都先收起二级选择菜单（避免旧候选残留）
      hideNearbySelector();

      if (!navigator.geolocation) {
        locateBtnLoading(btn, false);
        resultEl.textContent = '当前浏览器不支持定位，无法获取您所在小区';
        if (!currentDetailCommunityId) {
          renderLocateFallbackPrompt('当前浏览器不支持定位功能。您可以点击「去搜索」，直接输入您所在的小区名称进行查找。');
        }
        return;
      }

      locateBtnLoading(btn, true);
      resultEl.textContent = '正在获取您的位置…';

      // 超时保护（部分微信内 WebView 定位很慢或静默失败）
      const timeout = setTimeout(() => {
        if (seq !== locateSeq) return;
        locateBtnLoading(btn, false);
        resultEl.textContent = '定位超时，请开启定位后重新尝试';
        if (!currentDetailCommunityId) {
          renderLocateFallbackPrompt('定位超时，未能获取您的位置。请检查网络信号或所在位置后重试，也可以点击「去搜索」直接输入小区名称。');
        }
      }, 10000);

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          if (seq !== locateSeq) return;
          clearTimeout(timeout);
          locateBtnLoading(btn, false);
          const { latitude, longitude, accuracy } = pos.coords;
          // 浏览器返回 WGS-84 坐标，必须转 GCJ-02 后再匹配/渲染（否则 TMap 上偏移 300~700 米）
          const gcj = wgs84ToGcj02(latitude, longitude);
          // V5: 记录原始用户坐标（已转 GCJ-02），供真实地图渲染用户位置点（蓝色圆点）
          lastUserLat = gcj.lat;
          lastUserLng = gcj.lng;
          // 低精度兜底：accuracy > 1000 米时追加提示（仍按流程继续）
          const lowAccuracy = (accuracy != null && accuracy > 1000);

          // 服务范围保护：距最近服务小区过远（如用户在上海），提示不在服务区，不强行匹配
          const nearest = matchCommunity(gcj.lat, gcj.lng);
          if (nearest.community && nearest.distKm > 60) {
            resultEl.textContent = '您当前不在南京服务范围内（距最近服务点约 ' +
              Math.round(nearest.distKm) + ' 公里）';
            // 服务范围外：清空定位与详情，不展示任何小区（隐私红线）
            locatedCommunityId = null;
            currentDetailCommunityId = null;
            // 蓝点仍显示在用户真实位置（GCJ-02 修正后），地图居中到用户位置
            highlightCommunityOnMap(null);
            if (tmap) syncRealMapWithState();
            renderLocateFallbackPrompt('您当前不在南京服务范围内（距最近服务点约 ' +
              Math.round(nearest.distKm) + ' 公里）。如您所在的小区不在服务列表，请联系您的宁家保服务专员。');
            return;
          }

          // 附近小区识别（1km 半径内，按距离升序）
          const nearby = nearbyCommunities(gcj.lat, gcj.lng, NEARBY_RADIUS_KM);

          // 1km 内无小区：若此前已定位，保留原结果；否则引导手动搜索
          if (nearby.length === 0) {
            const prevName = locatedCommunityName();
            if (prevName) {
              resultEl.textContent = '未找到新的附近小区，仍展示此前定位的「' + prevName + '」';
              if (tmap) syncRealMapWithState();
              return;
            }
            resultEl.textContent = lowAccuracy
              ? '未找到附近小区，可手动搜索小区名称（当前定位精度较低，结果可能有偏差）'
              : '未找到附近小区，可手动搜索小区名称';
            highlightCommunityOnMap(null);
            if (tmap) syncRealMapWithState();
            renderLocateFallbackPrompt('未找到附近小区。您可以点击「去搜索」，直接输入您所在的小区名称进行查找。');
            return;
          }

          // 恰好 1 个：直接展示该小区联系方式
          if (nearby.length === 1) {
            locateToCommunity(nearby[0].community.id, nearby[0].distKm, lowAccuracy);
            return;
          }

          // 多个（≥2）：先展示二级选择菜单，等客户选择后再展示联系方式
          resultEl.textContent = lowAccuracy
            ? '定位完成（当前定位精度较低，结果可能有偏差）'
            : '定位完成，为您找到 ' + nearby.length + ' 个附近小区';
          // 尚未确认所在小区：清空定位与详情，点位/搜索仍走隐私保护
          locatedCommunityId = null;
          currentDetailCommunityId = null;
          searchNearbyList = null;
          highlightCommunityOnMap(null);
          if (tmap) syncRealMapWithState();
          renderNearbySelector(nearby, lowAccuracy);
          renderPrompt('已为您找到 ' + nearby.length + ' 个附近小区，请选择您所在的小区，即可查看对应的维修师傅联系方式。');
        },
        (err) => {
          if (seq !== locateSeq) return;
          clearTimeout(timeout);
          locateBtnLoading(btn, false);
          // 权限拒绝 / 位置不可用 / 超时 的分级友好降级
          let msg = '无法获取定位';
          let guide = '您可以点击「去搜索」，直接输入您所在的小区名称进行查找。';
          if (err && err.code === 1) {
            msg = '未授权定位权限';
            guide = '请在浏览器设置 / 微信右上角「...」菜单中开启定位权限后点击「重新定位」，或点击「去搜索」直接输入小区名称。';
          } else if (err && err.code === 2) {
            msg = '暂时无法获取位置信息';
            guide = '请检查网络与定位开关后点击「重新定位」，或点击「去搜索」直接输入小区名称。';
          } else if (err && err.code === 3) {
            msg = '定位超时';
            guide = '定位超时可能是网络较慢或信号不佳，请点击「重新定位」重试，或点击「去搜索」直接输入小区名称。';
          } else {
            msg = '无法获取定位';
            guide = '请确认已允许定位权限后点击「重新定位」，或点击「去搜索」直接输入小区名称。';
          }
          resultEl.textContent = msg + '，请开启定位后重新尝试';
          if (!currentDetailCommunityId) {
            renderLocateFallbackPrompt(msg + '。' + guide);
          }
        },
        // 高精度定位（GPS/基站），显著降低 wifi/IP 定位的百米级~公里级误差
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 10000 }
      );
    }

    // ==========================================
    // V9: 附近小区二级选择菜单 + 定位失败兜底
    // ==========================================

    // 隐藏并清空二级选择菜单
    function hideNearbySelector() {
      const container = document.getElementById('nearbySelector');
      if (container) {
        container.classList.add('hidden');
        container.innerHTML = '';
      }
    }

    // 渲染二级选择菜单（仅展示候选小区：名称 + 区 + 所在区；绝不暴露联系方式）
    // mode: 'locate' | 'search'，用于调整标题、距离文案和按钮语义
    function renderNearbySelector(nearbyList, lowAccuracy, options) {
      const container = document.getElementById('nearbySelector');
      if (!container) return;
      const list = (nearbyList || []).filter(item => item && item.community);
      if (list.length < 2) {
        hideNearbySelector();
        return;
      }
      const mode = (options && options.mode) || 'locate';
      const title = (options && options.title) || `为您找到 ${list.length} 个附近小区，请选择`;
      const navText = (options && options.navText) || '重新定位';
      const navAction = (options && options.navAction) || locateToCommunity;
      const cardsHtml = list.map(item => {
        const c = COMMUNITIES.find(x => x.id === item.community.id);
        const name = c ? c.name : item.community.id;
        const district = c && c.district ? c.district : '';
        const distText = item.distKm == null
          ? '选择查看'
          : (mode === 'search'
            ? '距定位点约 ' + (item.distKm < 1
              ? Math.max(1, Math.round(item.distKm * 1000)) + ' 米'
              : item.distKm.toFixed(1) + ' 公里')
            : '距您约 ' + (item.distKm < 1
              ? Math.max(1, Math.round(item.distKm * 1000)) + ' 米'
              : item.distKm.toFixed(1) + ' 公里'));
        return `
          <button type="button" class="nearby-option w-full text-left flex items-start justify-between gap-3 px-4 py-3 bg-white rounded-xl border border-divider shadow-sm transition-colors" data-comm-id="${escapeHtml(item.community.id)}" data-dist-km="${item.distKm == null ? '' : item.distKm}">
            <div class="min-w-0" style="flex: 1 1 auto; min-width: 0;">
              <p class="text-text font-medium text-sm nearby-name">${escapeHtml(name)}</p>
              <p class="text-text-muted text-xs mt-1">${escapeHtml(district)}</p>
            </div>
            <span class="flex-shrink-0 text-xs bg-primary/10 text-primary px-2 py-1 rounded-md mt-0.5">${distText}</span>
          </button>
        `;
      }).join('');

      container.innerHTML = `
        <div class="mt-3 bg-card rounded-2xl border border-primary/20 shadow-sm overflow-hidden">
          <div class="flex items-center justify-between px-4 pt-3 pb-2">
            <p class="text-text font-medium text-sm">${escapeHtml(title)}</p>
            <button type="button" id="nearbySelectorNavBtn" class="inline-flex items-center gap-1 text-xs text-primary bg-primary/10 px-2.5 py-1.5 rounded-full">${escapeHtml(navText)}</button>
          </div>
          <div class="px-3 pb-3 max-h-56 overflow-y-auto flex flex-col gap-2">
            ${cardsHtml}
          </div>
        </div>
      `;
      container.classList.remove('hidden');

      // 点击候选小区 → 展示该小区联系方式并收起菜单
      container.querySelectorAll('.nearby-option').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.dataset.commId;
          const distKm = btn.dataset.distKm === '' ? null : parseFloat(btn.dataset.distKm);
          if (!id) return;
          navAction(id, distKm, lowAccuracy);
        });
      });
      // 「重新定位 / 返回定位」小按钮：搜索菜单的“返回定位”恢复原定位，避免丢状态
      const navBtn = container.querySelector('#nearbySelectorNavBtn');
      if (navBtn) navBtn.addEventListener('click', () => {
        if (mode === 'search' && locatedCommunityId) {
          const c = COMMUNITIES.find(x => x.id === locatedCommunityId);
          if (c) {
            locateToCommunity(c.id, null, false);
          } else {
            realLocate();
          }
        } else {
          realLocate();
        }
      });
    }

    // 聚焦搜索框（供「去搜索」入口使用）
    function focusSearchInput() {
      const input = document.getElementById('searchInput');
      if (input) {
        input.focus();
        try {
          input.scrollIntoView({ behavior: 'smooth', block: 'center' });
        } catch (err) {
          // 老浏览器不支持平滑滚动则忽略
        }
      }
    }

    // 定位失败 / 无结果的兜底提示卡（含「重新定位」与「去搜索」两个可点入口）
    function renderLocateFallbackPrompt(msg) {
      // 已有展示中的小区详情时，保留详情卡不覆盖，仅在定位结果区提示
      if (currentDetailCommunityId) return;
      const detailContent = document.getElementById('detailContent');
      if (!detailContent) return;
      detailContent.innerHTML = `
        <div class="bg-card rounded-2xl p-6 text-center shadow-sm border border-divider view-fade">
          <div class="mx-auto w-10 h-10 flex items-center justify-center rounded-full bg-amber-50 mb-3">
            <svg class="w-5 h-5 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
          </div>
          <p class="text-text text-sm leading-relaxed mb-4">${escapeHtml(msg)}</p>
          <div class="flex gap-2 justify-center">
            <button type="button" id="fallbackRelocateBtn" class="flex-1 py-2.5 bg-primary text-white rounded-xl text-sm font-medium" style="max-width:10rem">重新定位</button>
            <button type="button" id="fallbackSearchBtn" class="flex-1 py-2.5 bg-white border border-primary text-primary rounded-xl text-sm font-medium" style="max-width:10rem">去搜索</button>
          </div>
        </div>
      `;
      const relocateBtn = detailContent.querySelector('#fallbackRelocateBtn');
      if (relocateBtn) relocateBtn.addEventListener('click', () => {
        realLocate();
      });
      const searchBtn = detailContent.querySelector('#fallbackSearchBtn');
      if (searchBtn) searchBtn.addEventListener('click', () => {
        focusSearchInput();
      });
    }

    // ==========================================
    // 搜索功能（V10：未定位搜索全部；已定位搜索定位点附近 1km）
    // ==========================================
    function initSearch() {
      const searchInput = document.getElementById('searchInput');
      const clearBtn = document.getElementById('clearSearch');

      let debounceTimer;

      // 未定位：搜索全部小区作为手动兜底，选择后即视为已定位到该小区
      const searchAllCommunities = (kwLower) => {
        return COMMUNITIES.filter(c =>
          (c.name || '').toLowerCase().includes(kwLower) ||
          (c.address || '').toLowerCase().includes(kwLower)
        );
      };

      // 已定位：在定位点附近 1km 内搜索（含当前定位小区本身）
      const searchNearbyCommunities = (kwLower) => {
        const located = COMMUNITIES.find(c => c.id === locatedCommunityId);
        const coord = located ? COMMUNITY_COORDS.find(x => x.id === located.id) : null;
        if (!coord) return [];
        return nearbyCommunities(coord.lat, coord.lng, SEARCH_NEARBY_RADIUS_KM)
          .map(item => ({
            community: item.community,
            distKm: item.distKm
          }))
          .filter(item => {
            const c = COMMUNITIES.find(x => x.id === item.community.id);
            return c && (
              (c.name || '').toLowerCase().includes(kwLower) ||
              (c.address || '').toLowerCase().includes(kwLower)
            );
          });
      };

      const handleMatchedList = (matched, source) => {
        const located = locatedCommunityId
          ? COMMUNITIES.find(c => c.id === locatedCommunityId)
          : null;
        const kwForPrompt = searchInput.value.trim();
        if (matched.length === 1) {
          const searchMode = source === 'nearby';
          locateToCommunity(
            matched[0].community ? matched[0].community.id : matched[0].id,
            matched[0].distKm,
            false,
            searchMode ? 'search' : undefined
          );
          return;
        }
        if (matched.length > 1) {
          searchNearbyList = matched;
          searchNearbyLowAccuracy = false;
          currentDetailCommunityId = null;
          highlightCommunityOnMap(null);
          renderNearbySelector(matched, false, {
            mode: 'search',
            title: source === 'all'
              ? `为您找到 ${matched.length} 个匹配小区，请选择`
              : `为您找到附近 ${matched.length} 个匹配小区，请选择`,
            navText: located ? '返回定位' : '重新定位',
            navAction: (id, distKm) => locateToCommunity(id, distKm, false, 'search')
          });
          renderPrompt(source === 'all'
            ? '已为您找到 ' + matched.length + ' 个匹配小区，请选择您所在的小区。'
            : '已为您找到附近 ' + matched.length + ' 个匹配小区，请选择。');
          return;
        }
        renderPrompt(source === 'nearby'
          ? '未找到「' + kwForPrompt + '」在附近 1km 内的小区，可核对小区名或重新定位后搜索。'
          : '未找到「' + kwForPrompt + '」对应的小区，请核对小区名后重试。');
      };

      searchInput.addEventListener('input', (e) => {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => {
          const kw = e.target.value.trim();
          clearBtn.classList.toggle('hidden', !kw);
          if (!kw) {
            // 清空搜索：恢复当前定位小区的详情卡或初始占位
            if (currentDetailCommunityId) {
              renderCommunityDetail(currentDetailCommunityId);
            } else {
              renderInitialPlaceholder();
            }
            return;
          }
          const kwLower = kw.toLowerCase();
          const located = locatedCommunityId
            ? COMMUNITIES.find(c => c.id === locatedCommunityId)
            : null;
          // 已定位：允许搜索定位点附近小区，并可直接切换
          const matched = located
            ? searchNearbyCommunities(kwLower)
            : searchAllCommunities(kwLower).map(c => ({ community: c, distKm: null }));
          handleMatchedList(matched, located ? 'nearby' : 'all');
        }, 200);
      });

      clearBtn.addEventListener('click', () => {
        searchInput.value = '';
        clearBtn.classList.add('hidden');
        searchNearbyList = null;
        searchNearbyLowAccuracy = false;
        if (currentDetailCommunityId) {
          renderCommunityDetail(currentDetailCommunityId);
        } else {
          renderInitialPlaceholder();
        }
      });
    }

    // ==========================================
    // 通用工具
    // ==========================================
    function escapeHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // ==========================================
    // 地图交互（V2：地图常驻，点位点击 → 唯一详情卡）
    // ==========================================

    // 高亮地图上的指定小区点位（null 清空全部）
    function highlightCommunityOnMap(communityId) {
      document.querySelectorAll('.nj-community-point').forEach(point => {
        const isActive = !!communityId && point.dataset.commId === communityId;
        point.classList.toggle('located', isActive);
        point.setAttribute('aria-pressed', isActive ? 'true' : 'false');
      });
      // V4: 定位小区的所属区同步高亮（蓝底），其余区还原
      let locatedDistrict = null;
      if (communityId) {
        const c = COMMUNITIES.find(x => x.id === communityId);
        if (c && c.district) locatedDistrict = c.district;
      }
      document.querySelectorAll('.nj-district-group').forEach(group => {
        group.classList.toggle('located', !!locatedDistrict && group.dataset.district === locatedDistrict);
      });
      // V5: 真实地图模式下同步 Marker（仅渲染当前定位小区 + 用户位置点）
      if (tmap) {
        syncRealMapWithState();
      }
    }

    // 应用小区点位的"有联系方式/正在邀请入驻"视觉状态（绿点=有联系方式，灰点=邀请中）
    function applyCommunityPointRichState() {
      const index = {};
      COMMUNITIES.forEach(c => { index[c.id] = c; });
      document.querySelectorAll('.nj-community-point').forEach(point => {
        const c = point.dataset.commId ? index[point.dataset.commId] : null;
        let hasWorker = false;
        if (c) {
          if (c.workerId) {
            const w = getWorkerById(c.workerId);
            hasWorker = !!(w && (w.phone || w.wechatId));
          } else if (c.contact) {
            const p = parseContact(c.contact);
            hasWorker = !!(p.phone || p.wechatId);
          }
        }
        point.classList.toggle('rich', hasWorker);
      });
    }

    // 详情卡占位（等待定位 / 清空选择）
    function renderInitialPlaceholder(message) {
      const detailContent = document.getElementById('detailContent');
      if (!detailContent) return;
      detailContent.innerHTML = `
        <div class="bg-card rounded-2xl p-6 text-center shadow-sm border border-divider view-fade">
          <div class="mx-auto w-12 h-12 flex items-center justify-center rounded-full bg-primary/10 mb-3">
            <svg class="w-6 h-6 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
          </div>
          <p class="text-text font-medium mb-1">请先选择您所在的小区</p>
          <p class="text-text-muted text-sm leading-relaxed">您可以点击上方「定位到我」，或在搜索框输入小区名称/地址进行查询。</p>
        </div>
      `;
    }

    // 详情卡提示（定位失败 / 搜索无结果 / 点击空白）
    function renderPrompt(msg) {
      const detailContent = document.getElementById('detailContent');
      if (!detailContent) return;
      detailContent.innerHTML = `
        <div class="bg-card rounded-2xl p-6 text-center shadow-sm border border-divider view-fade">
          <div class="mx-auto w-10 h-10 flex items-center justify-center rounded-full bg-amber-50 mb-3">
            <svg class="w-5 h-5 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
          </div>
          <p class="text-text text-sm leading-relaxed">${escapeHtml(msg)}</p>
        </div>
      `;
    }

    // 小区详情卡：完整师傅联系方式（拨打/微信/评分/评价）
    function renderCommunityDetail(communityId) {
      const c = COMMUNITIES.find(x => x.id === communityId);
      if (!c) return;
      currentDetailCommunityId = communityId;
      const contactInfo = getContactForCommunity(c);
      const w = contactInfo.workerId ? getWorkerById(contactInfo.workerId) : null;
      // 姓名不算可联系方式：无电话且无微信号时，即使管理后台已录入姓名也按“邀请入驻”展示
      const hasWorkerContact = !!(contactInfo.phone || contactInfo.wechatId);
      const ratingStat = computeRating(w);
      const starsForDisplay = ratingStat.avg > 0 ? Math.round(ratingStat.avg) : 0;

      const STAR_FILLED = '<svg class="w-4 h-4 text-amber-400" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.363-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>';
      const STAR_EMPTY = '<svg class="w-4 h-4 text-gray-300" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.363-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>';

      let html = '';

      // 小区信息卡
      html += `
        <div class="bg-card rounded-2xl p-4 mb-3 shadow-sm border border-divider">
          <h3 class="font-bold text-text text-lg mb-1">${escapeHtml(c.name)}</h3>
          <p class="text-text-muted text-xs flex items-center gap-1 mb-3">
            <svg class="w-3 h-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            ${escapeHtml(c.address)}
          </p>
          <div class="flex flex-wrap items-center gap-2">
            <span class="text-xs bg-chip text-text-secondary px-2 py-1 rounded-md">${escapeHtml(c.operator || '')}</span>
            <span class="text-xs bg-chip text-text-secondary px-2 py-1 rounded-md">${escapeHtml(c.district || '')}</span>
          </div>
        </div>
      `;

      if (!hasWorkerContact) {
        // 无师傅/无联系方式：提示正在邀请入驻（管理后台后续会逐个导入）
        html += `
          <div class="bg-amber-50 rounded-2xl p-4 mb-3 border border-amber-100">
            <div class="flex items-center gap-2 mb-2">
              <svg class="w-5 h-5 text-amber-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 14v3m4-3v3m4-3v3M3 21h18M3 10h18M3 10v11M3 7l9-4 9 4M9 10V7h6v3"></path></svg>
              <span class="text-amber-700 font-medium text-sm">本小区专属维修师傅正在邀请入驻</span>
            </div>
            <p class="text-amber-700/80 text-xs leading-relaxed mb-3">该小区专属师傅暂未开放联系方式，正在邀请入驻中。您可稍后再来查看，或联系宁家保服务专员咨询。</p>
            <button type="button" id="detailBackToMapBtn" class="w-full py-2.5 bg-white border border-amber-200 rounded-xl text-amber-700 text-sm font-medium">重新定位</button>
          </div>
        `;
      } else {
        // 有专属师傅：完整联系信息
        const skillsHtml = (contactInfo.skills && contactInfo.skills.length > 0) ? `
          <div class="flex flex-wrap gap-1.5 mb-3">
            ${contactInfo.skills.map(s => `<span class="tag-badge bg-chip text-text-secondary">${escapeHtml(String(s))}</span>`).join('')}
          </div>
        ` : '<p class="text-text-muted text-xs mb-3">未填写服务范围，可电话咨询</p>';

        const callBtnHtml = contactInfo.phone ? `
          <a href="tel:${escapeHtml(contactInfo.phone)}" class="flex-1 flex items-center justify-center gap-2 py-3 bg-primary text-white rounded-xl font-medium text-sm shadow-sm">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
            拨打
          </a>
        ` : '';
        const wechatBtnHtml = contactInfo.wechatId ? `
          <button type="button" class="copy-wechat-btn flex-1 flex items-center justify-center gap-2 py-3 bg-blue-500 text-white rounded-xl font-medium text-sm shadow-sm hover:bg-blue-600 transition-colors" data-wechat="${escapeHtml(contactInfo.wechatId)}">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
            <span class="copy-text">复制微信号</span>
          </button>
        ` : '';

        let ratingHtml = '';
        if (starsForDisplay > 0 || ratingStat.count > 0) {
          ratingHtml = `
            <div class="flex items-center gap-0.5 mb-1">
              ${Array.from({ length: 5 }, (_, i) => i < starsForDisplay ? STAR_FILLED : STAR_EMPTY).join('')}
              <span class="text-xs text-amber-600 font-medium ml-1">${ratingStat.avg.toFixed(1)}</span>
              <span class="text-xs text-text-muted">${ratingStat.count > 0 ? ratingStat.count + ' 条评价' : '（管理员预设）'}</span>
            </div>
          `;
        } else {
          ratingHtml = '<p class="text-xs text-text-muted mb-1">暂无评价</p>';
        }

        html += `
          <div class="bg-card rounded-2xl p-4 mb-3 shadow-sm border border-divider">
            <div class="flex items-center gap-2 mb-2">
              ${contactInfo.role ? `<span class="tag-badge bg-primary/10 text-primary font-medium">${escapeHtml(contactInfo.role)}</span>` : ''}
              <span class="font-bold text-text text-base">${escapeHtml(w ? (w.name || '物业联系人') : (contactInfo.name || '物业联系人'))}</span>
            </div>
            ${skillsHtml}
            ${ratingHtml}
            <button type="button" class="review-btn mb-3 inline-flex items-center gap-1 px-3 py-1.5 rounded-lg bg-amber-50 text-amber-600 text-xs font-medium border border-amber-200" data-worker-id="${escapeHtml(contactInfo.workerId || '')}">
              <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.363-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
              评价
            </button>
            <div class="border-t border-divider pt-3">
              <div class="flex items-center justify-between text-sm mb-1.5">
                <span class="text-text-secondary">联系电话</span>
                <span class="text-text font-medium">${escapeHtml(contactInfo.phone || '—')}</span>
              </div>
              <div class="flex items-center justify-between text-sm mb-3">
                <span class="text-text-secondary">微信号</span>
                <span class="text-text font-medium">${escapeHtml(contactInfo.wechatId || '—')}</span>
              </div>
              ${(callBtnHtml || wechatBtnHtml) ? `<div class="flex gap-3">${callBtnHtml}${wechatBtnHtml}</div>` : ''}
              ${contactInfo.note ? `<p class="text-xs text-text-muted mt-2 leading-relaxed">${escapeHtml(contactInfo.note)}</p>` : ''}
            </div>
          </div>
        `;
      }

      const detailContent = document.getElementById('detailContent');
      if (detailContent) {
        detailContent.innerHTML = html;
        // 绑定详情内的复制微信
        detailContent.querySelectorAll('.copy-wechat-btn').forEach(btn => bindWechatCopy(btn));
        // 绑定详情内的评价按钮
        detailContent.querySelectorAll('.review-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            openReviewModal(btn.dataset.workerId);
          });
        });
        // 招募卡片的"重新定位"：重新触发定位（不清空当前状态，失败则保留提示）
        const backBtn = detailContent.querySelector('#detailBackToMapBtn');
        if (backBtn) backBtn.addEventListener('click', () => {
          realLocate();
        });
      }
    }

    // 复制微信（navigator.clipboard 优先，降级用 textarea）
    function bindWechatCopy(btn) {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const wechatId = btn.dataset.wechat;
        if (!wechatId) return;
        const copyText = () => {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(wechatId).then(() => {
              showCopyFeedback(btn);
            }).catch(() => {
              fallbackCopy(wechatId, btn);
            });
          } else {
            fallbackCopy(wechatId, btn);
          }
        };
        copyText();
      });
    }

    // 当前定位小区名（用于提示文案；未定位返回 null）
    function locatedCommunityName() {
      const c = COMMUNITIES.find(x => x.id === locatedCommunityId);
      return c ? c.name : null;
    }

    // 未定位 / 非当前小区的统一提示（不暴露任何其他小区信息）
    function privacyPrompt() {
      const name = locatedCommunityName();
      if (!name) {
        renderPrompt('请先完成定位，才能查看您所在小区的专属维修师傅信息');
      } else {
        renderPrompt(`当前仅展示「${name}」的维修服务信息，其他小区暂不可查看`);
      }
    }

    // 初始化地图交互（V3：仅当前定位小区可查看；其他点位一律不暴露信息）
    function initMapView() {
      // 为每个点位插入涟漪圈（定位高亮时播放扩散动画）
      document.querySelectorAll('.nj-community-point').forEach(point => {
        const dot = point.querySelector('.nj-community-dot');
        if (dot && !point.querySelector('.nj-community-ripple')) {
          const ns = 'http://www.w3.org/2000/svg';
          const ripple = document.createElementNS(ns, 'circle');
          ripple.setAttribute('class', 'nj-community-ripple');
          ripple.setAttribute('cx', dot.getAttribute('cx'));
          ripple.setAttribute('cy', dot.getAttribute('cy'));
          ripple.setAttribute('r', '9');
          point.insertBefore(ripple, dot);
        }
      });

      // 小区点位点击：仅当前定位小区可查看详情，其余仅提示
      document.querySelectorAll('.nj-community-point').forEach(point => {
        const openCommunity = () => {
          const commId = point.dataset.commId;
          if (!commId) return;
          if (!locatedCommunityId || commId !== locatedCommunityId) {
            privacyPrompt();
            return;
          }
          currentDetailCommunityId = commId;
          highlightCommunityOnMap(commId);
          renderCommunityDetail(commId);
        };
        point.addEventListener('click', openCommunity);
        point.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            openCommunity();
          }
        });
      });

      // 地图空白处 / 区多边形：统一隐私提示
      const mapSvg = document.getElementById('njMap');
      if (mapSvg) {
        mapSvg.addEventListener('click', (e) => {
          if (!e.target.closest('.nj-community-point')) {
            privacyPrompt();
          }
        });
      }

      // 应用点位"有联系方式/邀请入驻中"视觉状态
      applyCommunityPointRichState();

      // 初始无高亮
      highlightCommunityOnMap(null);

      // V5: 渐进增强 —— 若用户已替换真实 Key，动态加载腾讯地图并切换到真实底图；
      // 占位符模式下不注入任何外部脚本，完全保持 V4 的 SVG 示意图模式
      if (TENCENT_MAP_ENABLED) {
        loadTencentMapSdk();
      }
    }

    // ==========================================
    // V5: 腾讯地图 GL JS 真实底图（渐进增强）
    // ==========================================

    // 动态加载腾讯地图 SDK（仅 Key 已替换时调用；占位符模式不会触发任何外部请求）
    function loadTencentMapSdk() {
      if (window.TMap) {
        initTMap();
        return;
      }
      if (tmapSdkLoading) return;
      const script = document.createElement('script');
      script.src = TENCENT_MAP_SDK_URL;
      script.async = true;
      script.charset = 'utf-8';
      script.onload = function () {
        tmapSdkLoading = false;
        if (window.TMap) {
          initTMap();
        } else {
          fallbackToSvgMode('腾讯地图 SDK 未就绪');
        }
      };
      script.onerror = function () {
        tmapSdkLoading = false;
        fallbackToSvgMode('腾讯地图 SDK 加载失败');
      };
      tmapSdkLoading = true;
      document.body.appendChild(script);
    }

    // 初始化真实地图：隐藏 SVG 示意图，显示腾讯底图
    function initTMap() {
      const container = document.getElementById('realMapContainer');
      if (!container) return;
      try {
        // 关键：必须先显示容器再初始化 TMap。
        // display:none 容器尺寸为 0，TMap 创建 WebGL 相机时 far plane ≤ 0，
        // 直接抛 "far <= 0" 导致初始化失败回退 SVG。
        const svgContainer = document.getElementById('svgMapContainer');
        if (svgContainer) svgContainer.style.display = 'none';
        container.style.display = 'block';
        const legend = document.getElementById('svgMapLegend');
        if (legend) legend.style.display = 'none';
        // 强制 reflow，确保容器已有真实尺寸（height:417px）后再初始化
        void container.offsetHeight;
        tmap = new TMap.Map(container, {
          // 南京城区中心（城市尺度，行政区边界由底图自带，不手动描画）
          center: new window.TMap.LatLng(32.060, 118.790),
          zoom: 10.5,
          viewMode: '2D'
        });
        // 中央提示浮层（默认"请先定位"；定位完成后由 syncRealMapWithState 隐藏）
        ensureRealMapLocateHint();
        // 同步已有状态（例如：SDK 加载完成时用户已定位）
        syncRealMapWithState();
      } catch (err) {
        console.warn('[腾讯地图] 初始化失败，已回退 SVG 示意图模式:', err);
        fallbackToSvgMode('腾讯地图初始化失败');
      }
    }

    // 创建"请先定位"中央提示浮层（幂等）
    function ensureRealMapLocateHint() {
      const container = document.getElementById('realMapContainer');
      if (!container) return;
      let hint = document.getElementById('realMapLocateHint');
      if (!hint) {
        hint = document.createElement('div');
        hint.id = 'realMapLocateHint';
        hint.textContent = '请先点击「定位到我」查看所在小区';
        container.appendChild(hint);
      }
    }

    // 用户位置蓝色圆点 Marker（含淡色涟漪环；独立样式，符合隐私红线）
    function createUserMarker() {
      const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 30 30">' +
        '<circle cx="15" cy="15" r="13" fill="rgba(37,99,235,0.16)"/>' +
        '<circle cx="15" cy="15" r="8.5" fill="#2563EB" stroke="#ffffff" stroke-width="2.5"/>' +
        '</svg>';
      const style = new window.TMap.MarkerStyle({
        width: 30,
        height: 30,
        anchor: { x: 15, y: 15 },
        src: 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg)
      });
      return new window.TMap.MultiMarker({
        map: tmap,
        zIndex: 1000,
        styles: { user: style },
        geometries: []
      });
    }

    // 当前定位小区 Marker（品牌蓝大头针；自定义内联 SVG，不用官方示例图）
    function createCommunityMarker() {
      const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="36" height="44" viewBox="0 0 36 44">' +
        '<path d="M18 1C9.7 1 3 7.7 3 16c0 11.2 15 27 15 27S33 27.2 33 16C33 7.7 26.3 1 18 1z" fill="#5B8CC9" stroke="#ffffff" stroke-width="2"/>' +
        '<circle cx="18" cy="15.5" r="5.5" fill="#ffffff"/>' +
        '</svg>';
      const style = new window.TMap.MarkerStyle({
        width: 36,
        height: 44,
        anchor: { x: 18, y: 44 },
        src: 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg)
      });
      return new window.TMap.MultiMarker({
        map: tmap,
        zIndex: 900,
        styles: { comm: style },
        geometries: []
      });
    }

    // 同步真实地图状态：仅渲染当前定位小区 Marker + 用户位置点；未定位时不渲染任何小区 Marker
    function syncRealMapWithState() {
      if (!tmap) return;
      const community = locatedCommunityId
        ? COMMUNITIES.find(x => x.id === locatedCommunityId)
        : null;
      const c0 = community
        ? COMMUNITY_COORDS.find(x => x.id === community.id)
        : null;
      const hasUserPos = lastUserLat != null && lastUserLng != null;

      // 1) 用户位置点（蓝色圆点；定位成功后即显示）
      if (hasUserPos) {
        if (!tmapUserMarker) tmapUserMarker = createUserMarker();
        tmapUserMarker.setGeometries([{
          id: 'user-pos',
          styleId: 'user',
          position: new window.TMap.LatLng(lastUserLat, lastUserLng)
        }]);
      } else if (tmapUserMarker) {
        tmapUserMarker.setGeometries([]);
      }

      // 2) 小区 Marker：仅当前定位小区（隐私红线：其他 33 个小区不入图）
      const commPos = (community && c0)
        ? new window.TMap.LatLng(c0.lat, c0.lng)
        : null;
      if (commPos) {
        if (!tmapCommMarker) tmapCommMarker = createCommunityMarker();
        tmapCommMarker.setGeometries([{
          id: community.id,
          styleId: 'comm',
          position: commPos,
          properties: { title: community.name + '（小区维修服务点）' }
        }]);
      } else if (tmapCommMarker) {
        tmapCommMarker.setGeometries([]);
      }

      // 3) 视角：定位完成 → 居中到用户小区（含用户位置）；仅用户 → 居中用户；都没有 → 城市底图 + 中央提示
      if (commPos) {
        if (hasUserPos) {
          const distKm = haversineKm(lastUserLat, lastUserLng, c0.lat, c0.lng);
          let zoom = 14;
          if (distKm < 0.6) zoom = 16;
          else if (distKm < 2) zoom = 15;
          else if (distKm < 5) zoom = 13.5;
          else zoom = 12;
          tmap.setCenter(new window.TMap.LatLng((lastUserLat + c0.lat) / 2, (lastUserLng + c0.lng) / 2));
          tmap.setZoom(zoom);
        } else {
          tmap.setCenter(commPos);
          tmap.setZoom(15);
        }
      } else if (hasUserPos) {
        tmap.setCenter(new window.TMap.LatLng(lastUserLat, lastUserLng));
        tmap.setZoom(13);
      } else {
        tmap.setCenter(new window.TMap.LatLng(32.060, 118.790));
        tmap.setZoom(10.5);
      }

      // 4) 中央提示：完全未定位时显示"请先定位"
      const hint = document.getElementById('realMapLocateHint');
      if (hint) hint.style.display = (hasUserPos || commPos) ? 'none' : 'block';
    }

    // 回退到 SVG 示意图模式（SDK 加载/初始化失败时自动降级，对用户零风险）
    function fallbackToSvgMode(reason) {
      console.warn('[腾讯地图] ' + reason + '，已回退至 SVG 示意图模式');
      const container = document.getElementById('realMapContainer');
      const svgContainer = document.getElementById('svgMapContainer');
      if (container) container.style.display = 'none';
      if (svgContainer) svgContainer.style.display = '';
      const legend = document.getElementById('svgMapLegend');
      if (legend) legend.style.display = '';
      // 销毁已创建的 TMap 实例与 Marker 图层
      if (tmap) {
        try { tmap.destroy(); } catch (e) { /* ignore */ }
        tmap = null;
        tmapUserMarker = null;
        tmapCommMarker = null;
      }
    }

    // ==========================================
    // 初始化
    // ==========================================

    function init() {
      // 加载数据（localStorage 优先，无则用默认）
      loadData();

      // 初始化地图交互（绑定小区点位点击）
      initMapView();

      // 初始化搜索（输入小区名 → 唯一详情卡）
      initSearch();

      // 详情卡初始占位
      renderInitialPlaceholder();

      // 绑定定位按钮（手动重新定位）
      document.getElementById('locateBtn').addEventListener('click', realLocate);

      // 不做自动定位：避免打开页面就被权限弹窗/10s 超时打断
      // 用户可主动点击「定位到我」，或使用搜索框手动选择小区
    }

    // DOM加载完成后初始化
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
