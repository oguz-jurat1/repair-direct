<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>宁家保 · 维修数据管理后台</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: #F3F6FB;
      color: #1F2937;
      line-height: 1.6;
    }
    .topbar {
      background: #19509F;
      color: #fff;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .topbar .brand { font-size: 16px; font-weight: 700; letter-spacing: 0.5px; }
    .topbar .brand small { font-weight: 400; opacity: 0.8; margin-left: 6px; font-size: 12px; }
    .topbar .user-area { display: flex; align-items: center; gap: 10px; font-size: 13px; }
    .topbar button {
      background: rgba(255,255,255,0.14);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .topbar button:hover { background: rgba(255,255,255,0.26); }
    .container { max-width: 1000px; margin: 0 auto; padding: 20px 16px 48px; }
    .hidden { display: none !important; }

    /* 认证卡片 */
    .auth-wrap { min-height: 60vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
    .auth-card {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border: 1px solid #E5EAF2;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(25,80,159,0.08);
      padding: 28px 24px;
    }
    .auth-card h1 { font-size: 20px; color: #19509F; margin-bottom: 4px; }
    .auth-card .sub { font-size: 13px; color: #6B7280; margin-bottom: 20px; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 13px; color: #374151; margin-bottom: 6px; font-weight: 500; }
    .field input, .field select, .field textarea {
      width: 100%;
      border: 1px solid #D6DEEB;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      background: #FAFCFF;
      outline: none;
      transition: border-color 0.15s ease;
    }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: #19509F; background: #fff; }
    .field textarea { resize: vertical; min-height: 64px; }
    .hint { font-size: 12px; color: #9CA3AF; margin-top: 4px; }
    .hint.err { color: #DC2626; }
    .hint.ok { color: #16A34A; }
    .btn {
      display: inline-block;
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s ease, background 0.15s ease;
      text-align: center;
    }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-primary { background: #19509F; color: #fff; }
    .btn-primary:hover:not(:disabled) { background: #143F7C; }
    .btn-block { width: 100%; display: block; }
    .btn-light { background: #EEF3FB; color: #19509F; border: 1px solid #D6E1F2; }
    .btn-light:hover { background: #E0EAFA; }
    .btn-danger { background: #FEE2E2; color: #B91C1C; border: 1px solid #FECACA; }
    .btn-danger:hover { background: #FECACA; }
    .btn-sm { padding: 5px 10px; font-size: 12px; border-radius: 7px; font-weight: 500; }
    .alert {
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 13px;
      margin-bottom: 14px;
      border: 1px solid transparent;
    }
    .alert-error { background: #FEF2F2; color: #B91C1C; border-color: #FECACA; }
    .alert-info { background: #EFF6FF; color: #1D4ED8; border-color: #BFDBFE; }
    .alert-lock { background: #FEF3C7; color: #B45309; border-color: #FDE68A; }
    .alert-ok { background: #F0FDF4; color: #15803D; border-color: #BBF7D0; }

    /* 主面板 */
    .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 18px; }
    .stat-card {
      background: #fff;
      border: 1px solid #E5EAF2;
      border-radius: 14px;
      padding: 14px 16px;
      box-shadow: 0 2px 10px rgba(25,80,159,0.05);
    }
    .stat-card .num { font-size: 26px; font-weight: 800; color: #19509F; line-height: 1.2; }
    .stat-card .lbl { font-size: 12px; color: #6B7280; margin-top: 2px; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; align-items: center; }
    .toolbar .spacer { flex: 1; }
    .toolbar input[type="text"], .toolbar input[type="search"] {
      border: 1px solid #D6DEEB;
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 13px;
      min-width: 180px;
      outline: none;
      background: #fff;
    }
    .toolbar input:focus { border-color: #19509F; }
    .card {
      background: #fff;
      border: 1px solid #E5EAF2;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 18px;
      box-shadow: 0 2px 10px rgba(25,80,159,0.05);
    }
    .card h2 {
      font-size: 15px;
      color: #19509F;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .card h2 .count { font-size: 12px; color: #9CA3AF; font-weight: 500; }
    .item-list { list-style: none; }
    .item-list li {
      border: 1px solid #EEF1F6;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 8px;
      background: #FBFCFE;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .item-main { min-width: 0; flex: 1 1 240px; }
    .item-title { font-size: 14px; font-weight: 600; color: #111827; }
    .item-sub { font-size: 12px; color: #6B7280; margin-top: 2px; }
    .item-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .badge {
      display: inline-block;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      background: #EEF3FB;
      color: #19509F;
      margin-left: 6px;
      font-weight: 500;
    }
    .badge.green { background: #E7F6EC; color: #15803D; }
    .badge.amber { background: #FEF3C7; color: #B45309; }
    .empty { text-align: center; color: #9CA3AF; font-size: 13px; padding: 18px 0; }
    .audit-list { list-style: none; }
    .audit-list li {
      display: flex;
      gap: 10px;
      font-size: 13px;
      padding: 6px 0;
      border-bottom: 1px dashed #EEF1F6;
    }
    .audit-list .t { color: #9CA3AF; flex-shrink: 0; font-variant-numeric: tabular-nums; }
    .audit-list .a { color: #374151; }

    /* 弹窗 */
    .modal-mask {
      position: fixed; inset: 0; background: rgba(15,23,42,0.45);
      display: flex; align-items: center; justify-content: center;
      padding: 16px; z-index: 100;
    }
    .modal {
      width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto;
      background: #fff; border-radius: 16px; padding: 22px 20px;
      box-shadow: 0 20px 50px rgba(15,23,42,0.25);
    }
    .modal h3 { font-size: 17px; color: #111827; margin-bottom: 16px; }
    .modal .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .modal .actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }

    /* Toast */
    #toast {
      position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
      background: rgba(17,24,39,0.92); color: #fff; font-size: 13px;
      padding: 10px 18px; border-radius: 999px; z-index: 200;
      opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
      max-width: 86vw; text-align: center;
    }
    #toast.show { opacity: 1; }

    .selftest-bar { background: #EFF6FF; border: 1px solid #BFDBFE; color: #1D4ED8; border-radius: 10px; padding: 8px 12px; font-size: 12px; margin-bottom: 14px; }
    .selftest-bar.fail { background: #FEF2F2; border-color: #FECACA; color: #B91C1C; }

    @media (max-width: 640px) {
      .stats-row { grid-template-columns: 1fr; }
      .modal .row2 { grid-template-columns: 1fr; }
      .topbar .brand small { display: none; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">宁家保 · 维修数据管理后台<small>仅限内部管理员使用</small></div>
    <div class="user-area hidden" id="userArea">
      <span id="currentUserLabel"></span>
      <button type="button" id="statsBtn" title="打开 51LA 访问统计报表（新窗口）">访问统计</button>
      <button type="button" id="changePwBtn">修改密码</button>
      <button type="button" id="logoutBtn">退出登录</button>
    </div>
  </header>

  <div class="container">
    <div id="selftestBar" class="selftest-bar hidden"></div>

    <!-- 认证区 -->
    <section class="auth-wrap" id="authPanel">
      <div class="auth-card">
        <div id="authLockAlert" class="alert alert-lock hidden"></div>
        <h1 id="authTitle">管理员登录</h1>
        <p class="sub" id="authSub">请输入管理员账号密码</p>

        <!-- 首次使用：创建管理员 -->
        <div id="createForm" class="hidden">
          <div class="field">
            <label for="createUser">用户名</label>
            <input type="text" id="createUser" autocomplete="off" placeholder="例如：admin">
          </div>
          <div class="field">
            <label for="createPass">密码</label>
            <input type="password" id="createPass" autocomplete="new-password" placeholder="至少 8 位，需含字母和数字">
            <p class="hint" id="createPassHint"></p>
          </div>
          <div class="field">
            <label for="createPass2">确认密码</label>
            <input type="password" id="createPass2" autocomplete="new-password" placeholder="再次输入密码">
          </div>
          <button type="button" class="btn btn-primary btn-block" id="createSubmit">创建管理员账号</button>
        </div>

        <!-- 已有管理员：登录 -->
        <div id="loginForm" class="hidden">
          <div class="field">
            <label for="loginUser">用户名</label>
            <input type="text" id="loginUser" autocomplete="username" placeholder="请输入用户名">
          </div>
          <div class="field">
            <label for="loginPass">密码</label>
            <input type="password" id="loginPass" autocomplete="current-password" placeholder="请输入密码">
            <p class="hint" id="loginHint"></p>
          </div>
          <button type="button" class="btn btn-primary btn-block" id="loginSubmit">登 录</button>
        </div>
      </div>
    </section>

    <!-- 管理主面板 -->
    <section id="mainPanel" class="hidden">
      <div class="stats-row">
        <div class="stat-card"><div class="num" id="statWorkers">0</div><div class="lbl">入驻师傅总数</div></div>
        <div class="stat-card"><div class="num" id="statCovered">0</div><div class="lbl">已覆盖小区（有师傅）</div></div>
        <div class="stat-card"><div class="num" id="statCommunities">0</div><div class="lbl">小区总数</div></div>
      </div>

      <div class="toolbar">
        <button class="btn btn-primary" id="addWorkerBtn">+ 新增师傅</button>
        <button class="btn btn-light" id="addCommunityBtn">+ 新增小区</button>
        <input type="search" id="searchInput" placeholder="搜索师傅 / 小区…">
        <div class="spacer"></div>
        <button class="btn btn-light" id="exportHtmlBtn">导出客户端页面</button>
        <button class="btn btn-light" id="exportJsonBtn">导出 JSON</button>
        <label class="btn btn-light" style="cursor:pointer;">导入 JSON<input type="file" id="importJsonInput" accept=".json,application/json" hidden></label>
        <button class="btn btn-light" id="restoreBtn">恢复默认</button>
      </div>

      <div class="card">
        <h2>师傅列表 <span class="count" id="workerCount"></span></h2>
        <ul class="item-list" id="workerList"></ul>
      </div>

      <div class="card">
        <h2>小区列表 <span class="count" id="communityCount"></span></h2>
        <ul class="item-list" id="communityList"></ul>
      </div>

      <div class="card">
        <h2>审计日志 <span class="count">最近 10 条</span></h2>
        <ul class="audit-list" id="auditList"></ul>
      </div>
    </section>
  </div>

  <!-- 师傅编辑弹窗 -->
  <div class="modal-mask hidden" id="workerModal">
    <div class="modal">
      <h3 id="workerModalTitle">新增师傅</h3>
      <div class="field">
        <label>姓名 *</label>
        <input type="text" id="wName" placeholder="师傅姓名">
      </div>
      <div class="row2">
        <div class="field">
          <label>角色</label>
          <select id="wRole">
            <option value="维修师傅">维修师傅</option>
            <option value="物业负责人">物业负责人</option>
            <option value="物业联系人">物业联系人</option>
            <option value="其他">其他</option>
          </select>
        </div>
        <div class="field">
          <label>评分（0-5）</label>
          <input type="number" id="wRating" min="0" max="5" step="0.1" value="0" placeholder="0">
        </div>
      </div>
      <div class="row2">
        <div class="field">
          <label>联系电话</label>
          <input type="text" id="wPhone" placeholder="11 位手机号">
        </div>
        <div class="field">
          <label>微信号</label>
          <input type="text" id="wWechat" placeholder="微信号 / wxid">
        </div>
      </div>
      <div class="field">
        <label>服务技能（逗号分隔）</label>
        <input type="text" id="wSkills" placeholder="例如：水电维修, 家电维修, 疏通">
      </div>
      <div class="field">
        <label>评分说明</label>
        <input type="text" id="wRatingNote" placeholder="例如：服务年限 8 年">
      </div>
      <div class="field">
        <label>备注</label>
        <textarea id="wNote" placeholder="补充说明（选填）"></textarea>
      </div>
      <div class="actions">
        <button class="btn btn-light" id="workerCancel">取消</button>
        <button class="btn btn-primary" id="workerSave">保存</button>
      </div>
    </div>
  </div>

  <!-- 小区编辑弹窗 -->
  <div class="modal-mask hidden" id="communityModal">
    <div class="modal">
      <h3 id="communityModalTitle">新增小区</h3>
      <div class="field">
        <label>小区名称 *</label>
        <input type="text" id="cName" placeholder="小区名称">
      </div>
      <div class="row2">
        <div class="field">
          <label>所属行政区</label>
          <select id="cDistrict">
            <option value="玄武区">玄武区</option>
            <option value="秦淮区">秦淮区</option>
            <option value="鼓楼区">鼓楼区</option>
            <option value="建邺区">建邺区</option>
            <option value="栖霞区">栖霞区</option>
            <option value="雨花台区">雨花台区</option>
            <option value="江宁区">江宁区</option>
            <option value="浦口区">浦口区</option>
            <option value="六合区">六合区</option>
            <option value="溧水区">溧水区</option>
            <option value="高淳区">高淳区</option>
          </select>
        </div>
        <div class="field">
          <label>运营方</label>
          <input type="text" id="cOperator" placeholder="物业/运营公司">
        </div>
      </div>
      <div class="field">
        <label>地址</label>
        <input type="text" id="cAddress" placeholder="小区地址">
      </div>
      <div class="row2">
        <div class="field">
          <label>关联师傅</label>
          <select id="cWorker"><option value="">（不关联）</option></select>
        </div>
        <div class="field">
          <label>传统联系文本（选填）</label>
          <input type="text" id="cContact" placeholder="旧格式：张三 13800000000">
        </div>
      </div>
      <div class="actions">
        <button class="btn btn-light" id="communityCancel">取消</button>
        <button class="btn btn-primary" id="communitySave">保存</button>
      </div>
    </div>
  </div>

  <!-- 修改密码弹窗 -->
  <div class="modal-mask hidden" id="changePwModal">
    <div class="modal">
      <h3>修改密码</h3>
      <div class="field">
        <label>原密码</label>
        <input type="password" id="oldPass" autocomplete="current-password">
      </div>
      <div class="field">
        <label>新密码</label>
        <input type="password" id="newPass" autocomplete="new-password" placeholder="至少 8 位，需含字母和数字">
        <p class="hint" id="newPassHint"></p>
      </div>
      <div class="field">
        <label>确认新密码</label>
        <input type="password" id="newPass2" autocomplete="new-password">
      </div>
      <div class="actions">
        <button class="btn btn-light" id="changePwCancel">取消</button>
        <button class="btn btn-primary" id="changePwSave">确认修改</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    // ============================================================
    // 宁家保维修数据管理后台（独立单文件，零外部依赖）
    // 鉴权：内联 SHA-256 + 随机盐 + 哈希存储；会话 7 天；连错 5 次锁 15 分钟；审计日志 10 条
    // 数据：与客户端同 origin 共享 localStorage key
    //   nj-repair.workers.v1 / nj-repair.communities.v1
    // ============================================================

    // ===================== 常量 =====================
    var AUTH_KEYS = {
      admin: 'nj-repair.admin.v1',
      session: 'nj-repair.session.v1',
      lock: 'nj-repair.login-lock.v1',
      audit: 'nj-repair.audit.v1'
    };
    var STORAGE_KEYS = {
      workers: 'nj-repair.workers.v1',
      communities: 'nj-repair.communities.v1'
    };
    var MAX_ATTEMPTS = 5;
    var LOCK_MS = 15 * 60 * 1000;   // 15 分钟
    var SESSION_MS = 7 * 24 * 60 * 60 * 1000; // 7 天

    // ===================== SHA-256（FIPS 180-4，ASCII 输入） =====================
    function sha256(ascii) {
      function rightRotate(value, amount) {
        return (value >>> amount) | (value << (32 - amount));
      }
      var mathPow = Math.pow;
      var maxWord = mathPow(2, 32);
      var lengthProperty = 'length';
      var i, j;
      var result = '';
      var words = [];
      var asciiBitLength = ascii[lengthProperty] * 8;
      var hash = sha256.h = sha256.h || [];
      var k = sha256.k = sha256.k || [];
      var primeCounter = k[lengthProperty];
      var isComposite = {};
      for (var candidate = 2; primeCounter < 64; candidate++) {
        if (!isComposite[candidate]) {
          for (i = 0; i < 313; i += candidate) {
            isComposite[i] = candidate;
          }
          hash[primeCounter] = (mathPow(candidate, 0.5) * maxWord) | 0;
          k[primeCounter++] = (mathPow(candidate, 1 / 3) * maxWord) | 0;
        }
      }
      ascii += '\x80';
      while (ascii[lengthProperty] % 64 - 56) ascii += '\x00';
      for (i = 0; i < ascii[lengthProperty]; i++) {
        j = ascii.charCodeAt(i);
        if (j >> 8) return '';
        words[i >> 2] |= j << ((3 - i) % 4) * 8;
      }
      words[words[lengthProperty]] = ((asciiBitLength / maxWord) | 0);
      words[words[lengthProperty]] = (asciiBitLength);
      for (j = 0; j < words[lengthProperty];) {
        var w = words.slice(j, j += 16);
        var oldHash = hash;
        hash = hash.slice(0, 8);
        for (i = 0; i < 64; i++) {
          var w15 = w[i - 15], w2 = w[i - 2];
          var a = hash[0], e = hash[4];
          var temp1 = hash[7]
            + (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25))
            + ((e & hash[5]) ^ ((~e) & hash[6]))
            + k[i]
            + (w[i] = (i < 16) ? w[i] : (
                w[i - 16]
                + (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3))
                + w[i - 7]
                + (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10))
              ) | 0);
          var temp2 = (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22))
            + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
          hash = [(temp1 + temp2) | 0].concat(hash);
          hash[4] = (hash[4] + temp1) | 0;
        }
        for (i = 0; i < 8; i++) {
          hash[i] = (hash[i] + oldHash[i]) | 0;
        }
      }
      for (i = 0; i < 8; i++) {
        for (j = 3; j + 1; j--) {
          var b = (hash[i] >> (j * 8)) & 255;
          result += ((b < 16) ? 0 : '') + b.toString(16);
        }
      }
      return result;
    }

    // UTF-8 字符串 → 字节串（每字符一个字节，供 sha256 使用；兼容中文）
    function utf8ToHex(str) {
      return unescape(encodeURIComponent(String(str)));
    }

    function sha256Hex(str) {
      return sha256(utf8ToHex(str));
    }

    // 恒定时间比较，避免时序侧信道
    function constantTimeEq(a, b) {
      if (typeof a !== 'string' || typeof b !== 'string') return false;
      if (a.length !== b.length) return false;
      var diff = 0;
      for (var i = 0; i < a.length; i++) {
        diff |= a.charCodeAt(i) ^ b.charCodeAt(i);
      }
      return diff === 0;
    }

    // 随机 token：crypto.getRandomValues 优先，降级 Math.random
    function generateToken() {
      if (window.crypto && window.crypto.getRandomValues) {
        var arr = new Uint8Array(32);
        window.crypto.getRandomValues(arr);
        var s = '';
        for (var i = 0; i < arr.length; i++) {
          s += (arr[i] < 16 ? '0' : '') + arr[i].toString(16);
        }
        return s;
      }
      return Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2) + Date.now().toString(36);
    }

    // ===================== 密码强度 =====================
    function passwordStrengthOk(pw) {
      return typeof pw === 'string' && pw.length >= 8 && /[A-Za-z]/.test(pw) && /\d/.test(pw);
    }

    // ===================== 管理员账号 =====================
    function getAdmin() {
      try {
        var raw = localStorage.getItem(AUTH_KEYS.admin);
        if (!raw) return null;
        var a = JSON.parse(raw);
        if (!a || !a.salt || !a.hash || !a.username) return null;
        return a;
      } catch (e) { return null; }
    }

    function hasAdmin() { return !!getAdmin(); }

    function createAdmin(username, pw) {
      var salt = generateToken();
      var admin = {
        username: String(username).trim(),
        salt: salt,
        hash: sha256Hex(salt + ':' + pw),
        createdAt: Date.now(),
        version: 1
      };
      localStorage.setItem(AUTH_KEYS.admin, JSON.stringify(admin));
      appendAudit('创建管理员账号：' + admin.username);
      return admin;
    }

    function verifyPassword(pw, admin) {
      if (!admin || !admin.salt || !admin.hash) return false;
      var h = sha256Hex(admin.salt + ':' + String(pw));
      return constantTimeEq(h, admin.hash);
    }

    // ===================== 登录锁定 =====================
    function getLock() {
      try {
        var raw = localStorage.getItem(AUTH_KEYS.lock);
        if (!raw) return null;
        var l = JSON.parse(raw);
        if (!l || typeof l.count !== 'number') return null;
        return l;
      } catch (e) { return null; }
    }

    function saveLock(lock) {
      try { localStorage.setItem(AUTH_KEYS.lock, JSON.stringify(lock)); } catch (e) {}
    }

    // 返回剩余锁定毫秒；0 表示未锁定
    function getLockRemainingMs() {
      var lock = getLock();
      if (!lock || !lock.until) return 0;
      var remain = lock.until - Date.now();
      if (remain <= 0) return 0;
      return remain;
    }

    function isLocked() { return getLockRemainingMs() > 0; }

    function recordFail() {
      var lock = getLock();
      var count = (lock && typeof lock.count === 'number') ? lock.count + 1 : 1;
      if (count >= MAX_ATTEMPTS) {
        var until = Date.now() + LOCK_MS;
        saveLock({ count: count, until: until });
        appendAudit('登录失败 ' + count + ' 次，账号锁定 15 分钟');
        return { locked: true, until: until };
      }
      saveLock({ count: count, until: 0 });
      appendAudit('登录失败（第 ' + count + ' 次，共 ' + MAX_ATTEMPTS + ' 次）');
      return { locked: false, remain: MAX_ATTEMPTS - count };
    }

    function resetLock() {
      try { localStorage.removeItem(AUTH_KEYS.lock); } catch (e) {}
    }

    // ===================== 会话（7 天） =====================
    function createSession() {
      var token = generateToken();
      var session = {
        token: token,
        createdAt: Date.now(),
        expiresAt: Date.now() + SESSION_MS
      };
      try { localStorage.setItem(AUTH_KEYS.session, JSON.stringify(session)); } catch (e) {}
      return token;
    }

    function getSession() {
      try {
        var raw = localStorage.getItem(AUTH_KEYS.session);
        if (!raw) return null;
        var s = JSON.parse(raw);
        if (!s || !s.token || !s.expiresAt) return null;
        return s;
      } catch (e) { return null; }
    }

    function isValidSession() {
      var s = getSession();
      if (!s) return false;
      return s.expiresAt > Date.now();
    }

    function destroySession() {
      try { localStorage.removeItem(AUTH_KEYS.session); } catch (e) {}
    }

    // ===================== 审计日志（最多 10 条） =====================
    function appendAudit(action) {
      try {
        var logs = JSON.parse(localStorage.getItem(AUTH_KEYS.audit)) || [];
        if (!Array.isArray(logs)) logs = [];
        logs.push({ time: new Date().toISOString(), action: String(action) });
        if (logs.length > 10) logs = logs.slice(logs.length - 10);
        localStorage.setItem(AUTH_KEYS.audit, JSON.stringify(logs));
      } catch (e) {}
    }

    function getAuditLogs() {
      try {
        var logs = JSON.parse(localStorage.getItem(AUTH_KEYS.audit));
        return Array.isArray(logs) ? logs : [];
      } catch (e) { return []; }
    }

    // ===================== 共享数据（与客户端同 key） =====================
    function loadWorkers() {
      try {
        var w = JSON.parse(localStorage.getItem(STORAGE_KEYS.workers));
        return Array.isArray(w) ? w : [];
      } catch (e) { return []; }
    }

    function saveWorkers(list) {
      try { localStorage.setItem(STORAGE_KEYS.workers, JSON.stringify(list)); } catch (e) { alert('数据保存失败：' + e.message); }
    }

    function loadCommunities() {
      try {
        var c = JSON.parse(localStorage.getItem(STORAGE_KEYS.communities));
        return Array.isArray(c) ? c : [];
      } catch (e) { return []; }
    }

    function saveCommunities(list) {
      try { localStorage.setItem(STORAGE_KEYS.communities, JSON.stringify(list)); } catch (e) { alert('数据保存失败：' + e.message); }
    }

    // 首次进入且无本地数据时，从内嵌客户端模板提取默认数据
    function ensureSeedData() {
      var w = loadWorkers();
      var c = loadCommunities();
      if (w.length === 0 || c.length === 0) {
        var template = decodeClientTemplate();
        var defaults = extractDefaultsFromTemplate(template);
        if (defaults.workers.length === 0 || defaults.communities.length === 0) {
          // 模板缺失时给出最小占位，保证后台可操作
          if (w.length === 0) saveWorkers([]);
          if (c.length === 0) saveCommunities([]);
          return;
        }
        if (w.length === 0) saveWorkers(defaults.workers);
        if (c.length === 0) saveCommunities(defaults.communities);
        appendAudit('初始化默认数据（从客户端模板提取）');
      }
    }

    function decodeClientTemplate() {
      try {
        var bin = atob(CLIENT_TEMPLATE_B64);
        var bytes = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return new TextDecoder('utf-8').decode(bytes);
      } catch (e) {
        return '';
      }
    }

    // 从模板文本提取 DEFAULT_WORKERS / DEFAULT_COMMUNITIES（JS 字面量 → 对象数组）
    function extractArrayFromTemplate(template, key, endMark) {
      var startTag = 'const ' + key + ' = [';
      var startIdx = template.indexOf(startTag);
      if (startIdx < 0) return [];
      var endIdx = template.indexOf(endMark, startIdx);
      if (endIdx < 0) return [];
      var seg = template.slice(startIdx + startTag.length, endIdx);
      // 去掉末尾 "];"（结尾形如 "];\n" 或 "];    "）
      seg = seg.replace(/\];\s*$/, '')
      try {
        var fn = new Function('return [' + seg + ']');
        var arr = fn();
        return Array.isArray(arr) ? arr : [];
      } catch (e) { return []; }
    }

    function extractDefaultsFromTemplate(template) {
      return {
        workers: extractArrayFromTemplate(template, 'DEFAULT_WORKERS', '// WORKERS_END'),
        communities: extractArrayFromTemplate(template, 'DEFAULT_COMMUNITIES', '// COMMUNITIES_END')
      };
    }

    // ===================== 鉴权自测（4 个用例） =====================
    function runAuthSelfTest() {
      var results = [];
      // 1) SHA-256('abc') 官方向量
      results.push({ name: 'SHA-256 标准向量', pass: sha256('abc') === 'ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad' });
      // 2) SHA-256 中文（UTF-8）确定性
      var h1 = sha256Hex('南京宁家保');
      var h2 = sha256Hex('南京宁家保');
      results.push({ name: '中文 UTF-8 哈希确定', pass: h1 === h2 && h1.length === 64 });
      // 3) 密码强度规则
      results.push({ name: '密码强度规则', pass: passwordStrengthOk('abc12345') && !passwordStrengthOk('short') && !passwordStrengthOk('12345678') });
      // 4) 恒定时间比较
      results.push({ name: '恒定时间比较', pass: constantTimeEq('a1b2', 'a1b2') && !constantTimeEq('a1b2', 'a1b3') });
      return results;
    }

    // ===================== 提示 Toast =====================
    var toastTimer = null;
    function showToast(msg) {
      var el = document.getElementById('toast');
      if (!el) return;
      el.textContent = msg;
      el.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2200);
    }

    function downloadBlob(content, filename, mime) {
      var blob = new Blob([content], { type: mime || 'application/octet-stream' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    }

    // ===================== 认证视图渲染 =====================
    function renderAuthView() {
      var authPanel = document.getElementById('authPanel');
      var mainPanel = document.getElementById('mainPanel');
      var userArea = document.getElementById('userArea');
      var lockAlert = document.getElementById('authLockAlert');
      var createForm = document.getElementById('createForm');
      var loginForm = document.getElementById('loginForm');
      var title = document.getElementById('authTitle');
      var sub = document.getElementById('authSub');

      if (isValidSession()) {
        enterAdmin();
        return;
      }

      authPanel.classList.remove('hidden');
      mainPanel.classList.add('hidden');
      userArea.classList.add('hidden');

      var remain = getLockRemainingMs();
      if (remain > 0) {
        lockAlert.classList.remove('hidden');
        lockAlert.textContent = '账号已锁定，请 ' + Math.ceil(remain / 60000) + ' 分钟后重试';
        createForm.classList.add('hidden');
        loginForm.classList.add('hidden');
        title.textContent = '账号已锁定';
        sub.textContent = '连续登录失败次数过多，已临时锁定';
        return;
      }
      lockAlert.classList.add('hidden');

      if (hasAdmin()) {
        title.textContent = '管理员登录';
        sub.textContent = '请输入管理员账号密码';
        createForm.classList.add('hidden');
        loginForm.classList.remove('hidden');
        document.getElementById('loginHint').textContent = '';
      } else {
        title.textContent = '创建管理员账号';
        sub.textContent = '首次使用，请创建管理员账号（密码至少 8 位，需含字母和数字）';
        createForm.classList.remove('hidden');
        loginForm.classList.add('hidden');
        document.getElementById('createPassHint').textContent = '';
      }
    }

    function enterAdmin() {
      document.getElementById('authPanel').classList.add('hidden');
      document.getElementById('mainPanel').classList.remove('hidden');
      document.getElementById('userArea').classList.remove('hidden');
      var admin = getAdmin();
      document.getElementById('currentUserLabel').textContent = admin ? ('管理员：' + admin.username) : '管理员';
      renderAdminMain();
    }

    function logoutAdmin() {
      destroySession();
      appendAudit('退出登录');
      renderAuthView();
      showToast('已退出登录');
    }

    // ===================== 登录 / 创建 / 锁定逻辑 =====================
    function handleCreate() {
      var userEl = document.getElementById('createUser');
      var passEl = document.getElementById('createPass');
      var pass2El = document.getElementById('createPass2');
      var hintEl = document.getElementById('createPassHint');
      var username = userEl.value.trim();
      var pw = passEl.value;
      var pw2 = pass2El.value;

      if (!username) { hintEl.className = 'hint err'; hintEl.textContent = '请输入用户名'; return; }
      if (!passwordStrengthOk(pw)) {
        hintEl.className = 'hint err';
        hintEl.textContent = '密码至少 8 位，且需同时包含字母和数字';
        return;
      }
      if (pw !== pw2) { hintEl.className = 'hint err'; hintEl.textContent = '两次输入的密码不一致'; return; }
      if (hasAdmin()) { showToast('管理员账号已存在'); renderAuthView(); return; }

      createAdmin(username, pw);
      createSession();
      appendAudit('创建管理员账号并登录：' + username);
      enterAdmin();
      showToast('管理员账号创建成功');
    }

    function handleLogin() {
      var userEl = document.getElementById('loginUser');
      var passEl = document.getElementById('loginPass');
      var hintEl = document.getElementById('loginHint');
      var username = userEl.value.trim();
      var pw = passEl.value;

      var remain = getLockRemainingMs();
      if (remain > 0) {
        hintEl.className = 'hint err';
        hintEl.textContent = '账号已锁定，请 ' + Math.ceil(remain / 60000) + ' 分钟后重试';
        return;
      }

      var admin = getAdmin();
      if (!admin) {
        hintEl.className = 'hint err';
        hintEl.textContent = '管理员账号不存在，请先创建';
        renderAuthView();
        return;
      }

      if (admin.username !== username || !verifyPassword(pw, admin)) {
        recordFail();
        var rem = getLockRemainingMs();
        appendAudit('登录失败：' + username);
        if (rem > 0) {
          hintEl.className = 'hint err';
          hintEl.textContent = '连续失败次数过多，账号已锁定 ' + Math.ceil(rem / 60000) + ' 分钟';
          renderAuthView();
        } else {
          hintEl.className = 'hint err';
          hintEl.textContent = '用户名或密码错误';
        }
        return;
      }

      resetLock();
      createSession();
      appendAudit('登录成功：' + username);
      userEl.value = '';
      passEl.value = '';
      enterAdmin();
      showToast('登录成功');
    }

    // ===================== 修改密码 =====================
    function openChangePw() {
      document.getElementById('changePwModal').classList.remove('hidden');
      document.getElementById('oldPass').value = '';
      document.getElementById('newPass').value = '';
      document.getElementById('newPass2').value = '';
      document.getElementById('newPassHint').textContent = '';
    }

    function closeChangePw() {
      document.getElementById('changePwModal').classList.add('hidden');
    }

    function handleChangePw() {
      var oldPw = document.getElementById('oldPass').value;
      var newPw = document.getElementById('newPass').value;
      var newPw2 = document.getElementById('newPass2').value;
      var hintEl = document.getElementById('newPassHint');
      var admin = getAdmin();
      if (!admin) { renderAuthView(); return; }
      if (!verifyPassword(oldPw, admin)) {
        hintEl.className = 'hint err';
        hintEl.textContent = '原密码错误';
        return;
      }
      if (!passwordStrengthOk(newPw)) {
        hintEl.className = 'hint err';
        hintEl.textContent = '新密码至少 8 位，且需同时包含字母和数字';
        return;
      }
      if (newPw !== newPw2) {
        hintEl.className = 'hint err';
        hintEl.textContent = '两次输入的新密码不一致';
        return;
      }
      admin.salt = generateToken();
      admin.hash = sha256Hex(admin.salt + ':' + newPw);
      try { localStorage.setItem(AUTH_KEYS.admin, JSON.stringify(admin)); } catch (e) { alert('保存失败：' + e.message); return; }
      appendAudit('修改密码');
      closeChangePw();
      showToast('密码修改成功');
    }

    // ===================== 主面板渲染 =====================
    function renderAdminMain() {
      renderStats();
      renderWorkerList();
      renderCommunityList();
      renderAuditList();
      rebuildCommunityWorkerOptions();
    }

    function renderStats() {
      var workers = loadWorkers();
      var communities = loadCommunities();
      var covered = 0;
      communities.forEach(function (c) {
        if (c.workerId) {
          var w = workers.find(function (x) { return x.id === c.workerId; });
          if (w) covered++;
        } else if (c.contact && c.contact.trim()) {
          covered++;
        }
      });
      document.getElementById('statWorkers').textContent = workers.length;
      document.getElementById('statCovered').textContent = covered;
      document.getElementById('statCommunities').textContent = communities.length;
    }

    function workerSubText(w) {
      var parts = [];
      if (w.phone) parts.push('电话 ' + w.phone);
      if (w.wechatId) parts.push('微信 ' + w.wechatId);
      if (Array.isArray(w.skills) && w.skills.length) parts.push('技能：' + w.skills.join('、'));
      if (typeof w.rating === 'number' && w.rating > 0) parts.push('评分 ' + w.rating.toFixed(1));
      return parts.join(' · ') || '暂无联系方式';
    }

    function workerLinkedCommunities(w) {
      var communities = loadCommunities();
      var linked = communities.filter(function (c) { return c.workerId === w.id; });
      return linked.length;
    }

    function renderWorkerList() {
      var workers = loadWorkers();
      var kw = (document.getElementById('searchInput').value || '').trim().toLowerCase();
      var filtered = workers.filter(function (w) {
        if (!kw) return true;
        return (w.name || '').toLowerCase().indexOf(kw) >= 0
          || (w.phone || '').toLowerCase().indexOf(kw) >= 0
          || (w.wechatId || '').toLowerCase().indexOf(kw) >= 0
          || (Array.isArray(w.skills) ? w.skills.join(' ') : '').toLowerCase().indexOf(kw) >= 0;
      });
      document.getElementById('workerCount').textContent = filtered.length + ' / ' + workers.length;
      var ul = document.getElementById('workerList');
      ul.innerHTML = '';
      if (filtered.length === 0) {
        ul.innerHTML = '<li class="empty">暂无师傅数据</li>';
        return;
      }
      filtered.forEach(function (w) {
        var li = document.createElement('li');
        var linked = workerLinkedCommunities(w);
        var roleBadge = w.role ? '<span class="badge">' + escapeHtml(String(w.role)) + '</span>' : '';
        var linkedBadge = linked > 0 ? '<span class="badge green">' + linked + ' 个小区</span>' : '<span class="badge amber">未关联小区</span>';
        li.innerHTML = ''
          + '<div class="item-main">'
          + '<div class="item-title">' + escapeHtml(String(w.name || '未命名师傅')) + roleBadge + linkedBadge + '</div>'
          + '<div class="item-sub">' + escapeHtml(workerSubText(w)) + '</div>'
          + '</div>'
          + '<div class="item-actions">'
          + '<button class="btn btn-light btn-sm" data-edit-worker="' + escapeHtml(String(w.id)) + '">编辑</button>'
          + '<button class="btn btn-danger btn-sm" data-del-worker="' + escapeHtml(String(w.id)) + '">删除</button>'
          + '</div>';
        ul.appendChild(li);
      });
      ul.querySelectorAll('[data-edit-worker]').forEach(function (btn) {
        btn.addEventListener('click', function () { openWorkerForm(btn.getAttribute('data-edit-worker')); });
      });
      ul.querySelectorAll('[data-del-worker]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var id = btn.getAttribute('data-del-worker');
          if (confirm('确认删除该师傅？关联小区将保留但显示为「招募中」。')) deleteWorker(id);
        });
      });
    }

    function communitySubText(c) {
      var parts = [];
      if (c.district) parts.push(c.district);
      if (c.address) parts.push(c.address);
      if (c.operator) parts.push(c.operator);
      var workerName = '';
      if (c.workerId) {
        var w = loadWorkers().find(function (x) { return x.id === c.workerId; });
        workerName = w ? w.name : '';
      }
      if (workerName) parts.push('师傅：' + workerName);
      else if (c.contact && c.contact.trim()) parts.push('联系：' + c.contact);
      else parts.push('招募中');
      return parts.join(' · ');
    }

    function renderCommunityList() {
      var communities = loadCommunities();
      var kw = (document.getElementById('searchInput').value || '').trim().toLowerCase();
      var filtered = communities.filter(function (c) {
        if (!kw) return true;
        return (c.name || '').toLowerCase().indexOf(kw) >= 0
          || (c.address || '').toLowerCase().indexOf(kw) >= 0
          || (c.district || '').toLowerCase().indexOf(kw) >= 0;
      });
      document.getElementById('communityCount').textContent = filtered.length + ' / ' + communities.length;
      var ul = document.getElementById('communityList');
      ul.innerHTML = '';
      if (filtered.length === 0) {
        ul.innerHTML = '<li class="empty">暂无小区数据</li>';
        return;
      }
      filtered.forEach(function (c) {
        var li = document.createElement('li');

        if (c.workerId) {
          var w = loadWorkers().find(function (x) { return x.id === c.workerId; });
          workerBadge = w ? '<span class="badge green">有师傅</span>' : '<span class="badge amber">师傅缺失</span>';

          + '</div>'
          + '<div class="item-actions">'
          + '<button class="btn btn-light btn-sm" data-edit-community="' + escapeHtml(String(c.id)) + '">编辑</button>'
          + '<button class="btn btn-danger btn-sm" data-del-community="' + escapeHtml(String(c.id)) + '">删除</button>'
          + '</div>';

        btn.addEventListener('click', function () { openCommunityForm(btn.getAttribute('data-edit-community')); });
      });

        btn.addEventListener('click', function () {
          var id = btn.getAttribute('data-del-community');
          if (confirm('确认删除该小区？')) deleteCommunity(id);

    function renderAuditList() {
      var logs = getAuditLogs();
      var ul = document.getElementById('auditList');
      ul.innerHTML = '';
      if (logs.length === 0) {
        ul.innerHTML = '<li class="empty">暂无审计记录</li>';
        return;
      }
      logs.slice().reverse().forEach(function (log) {
        var li = document.createElement('li');
        var t = document.createElement('span');
        t.className = 't';
        try {
          var d = new Date(log.time);
          t.textContent = d.toLocaleString('zh-CN', { hour12: false });
        } catch (e) {
          t.textContent = log.time || '';
        }
        var a = document.createElement('span');
        a.className = 'a';
        a.textContent = log.action || '';
        li.appendChild(t);
        li.appendChild(a);
        ul.appendChild(li);
      });
    }

    function escapeHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // ===================== 师傅 CRUD =====================
    var editingWorkerId = null;

    function openWorkerForm(workerId) {
      editingWorkerId = workerId || null;
      var workers = loadWorkers();
      var w = editingWorkerId ? workers.find(function (x) { return x.id === editingWorkerId; }) : null;
      document.getElementById('workerModalTitle').textContent = w ? '编辑师傅' : '新增师傅';
      document.getElementById('wName').value = w ? (w.name || '') : '';
      document.getElementById('wRole').value = w ? (w.role || '维修师傅') : '维修师傅';
      document.getElementById('wPhone').value = w ? (w.phone || '') : '';
      document.getElementById('wWechat').value = w ? (w.wechatId || '') : '';
      document.getElementById('wSkills').value = (w && Array.isArray(w.skills)) ? w.skills.join(', ') : '';
      document.getElementById('wRating').value = w ? (typeof w.rating === 'number' ? w.rating : 0) : 0;
      document.getElementById('wRatingNote').value = w ? (w.ratingNote || '') : '';
      document.getElementById('wNote').value = w ? (w.note || '') : '';
      document.getElementById('workerModal').classList.remove('hidden');
    }

    function closeWorkerForm() {
      document.getElementById('workerModal').classList.add('hidden');
      editingWorkerId = null;
    }

    function saveWorkerFromForm() {
      var name = document.getElementById('wName').value.trim();
      if (!name) { alert('请输入师傅姓名'); return; }
      var workers = loadWorkers();
      var skills = document.getElementById('wSkills').value.split(',').map(function (s) { return s.trim(); }).filter(Boolean);
      var rating = parseFloat(document.getElementById('wRating').value);
      if (isNaN(rating)) rating = 0;
      if (rating < 0) rating = 0;
      if (rating > 5) rating = 5;
      var data = {
        id: editingWorkerId || ('w' + Date.now().toString(36) + Math.floor(Math.random() * 1e6).toString(36)),
        name: name,
        role: document.getElementById('wRole').value,
        phone: document.getElementById('wPhone').value.trim(),
        wechatId: document.getElementById('wWechat').value.trim(),
        skills: skills,
        rating: rating,
        ratingNote: document.getElementById('wRatingNote').value.trim(),
        note: document.getElementById('wNote').value.trim()
      };
      if (editingWorkerId) {
        var idx = workers.findIndex(function (x) { return x.id === editingWorkerId; });
        if (idx >= 0) {
          workers[idx] = data;
          appendAudit('编辑师傅：' + name);
        }
      } else {
        workers.push(data);
        appendAudit('新增师傅：' + name);
      }
      saveWorkers(workers);
      closeWorkerForm();
      renderAdminMain();
      showToast('师傅数据已保存');
    }

    function deleteWorker(id) {
      var workers = loadWorkers().filter(function (x) { return x.id !== id; });
      // 解除该师傅在小区上的关联，避免悬挂引用
      var communities = loadCommunities().map(function (c) {
        if (c.workerId === id) { c.workerId = null; }
        return c;
      });
      saveWorkers(workers);
      saveCommunities(communities);
      appendAudit('删除师傅：' + id);
      renderAdminMain();
      showToast('师傅已删除');
    }

    // ===================== 小区 CRUD =====================
    var editingCommunityId = null;

    function rebuildCommunityWorkerOptions() {
      var workers = loadWorkers();
      var sel = document.getElementById('cWorker');
      var current = sel.getAttribute('data-current') || '';
      sel.innerHTML = '';
      var opt0 = document.createElement('option');
      opt0.value = '';
      opt0.textContent = '（不关联）';
      sel.appendChild(opt0);
      workers.forEach(function (w) {
        var opt = document.createElement('option');
        opt.value = w.id;
        opt.textContent = w.name + (w.role ? '（' + w.role + '）' : '');
        sel.appendChild(opt);
      });
      sel.value = current;

    function openCommunityForm(communityId) {
      editingCommunityId = communityId || null;
      var communities = loadCommunities();
      var c = editingCommunityId ? communities.find(function (x) { return x.id === editingCommunityId; }) : null;
      document.getElementById('communityModalTitle').textContent = c ? '编辑小区' : '新增小区';
      document.getElementById('cName').value = c ? (c.name || '') : '';
      document.getElementById('cDistrict').value = c ? (c.district || '玄武区') : '玄武区';

      document.getElementById('cAddress').value = c ? (c.address || '') : '';
      rebuildCommunityWorkerOptions();

      sel.setAttribute('data-current', c && c.workerId ? c.workerId : '');

      document.getElementById('communityModal').classList.remove('hidden');

    function closeCommunityForm() {
      document.getElementById('communityModal').classList.add('hidden');
      editingCommunityId = null;
    }

    function saveCommunityFromForm() {
      var name = document.getElementById('cName').value.trim();
      if (!name) { alert('请输入小区名称'); return; }
      var communities = loadCommunities();
      var data = {
        id: editingCommunityId || ('c' + Date.now().toString(36) + Math.floor(Math.random() * 1e6).toString(36)),
        district: document.getElementById('cDistrict').value,
        name: name,
        address: document.getElementById('cAddress').value.trim(),
        operator: document.getElementById('cOperator').value.trim(),
        workerId: document.getElementById('cWorker').value || null,
        contact: document.getElementById('cContact').value.trim() || null
      };
      if (editingCommunityId) {
        var idx = communities.findIndex(function (x) { return x.id === editingCommunityId; });
        if (idx >= 0) {
          communities[idx] = data;
          appendAudit('编辑小区：' + name);
        }
      } else {
        communities.push(data);
        appendAudit('新增小区：' + name);
      }
      saveCommunities(communities);
      closeCommunityForm();
      renderAdminMain();
      showToast('小区数据已保存');
    }

    function deleteCommunity(id) {
      var communities = loadCommunities().filter(function (x) { return x.id !== id; });
      saveCommunities(communities);
      appendAudit('删除小区：' + id);
      renderAdminMain();
      showToast('小区已删除');
    }

    // ===================== 导出 / 导入 / 恢复默认 =====================
    function exportClientPage() {
      var template = decodeClientTemplate();
      if (!template) {
        alert('客户端模板缺失，无法导出。请重新获取 admin.html。');
        return;
      }
      var workers = loadWorkers();
      var communities = loadCommunities();
      var wJson = JSON.stringify(workers, null, 2);
      var cJson = JSON.stringify(communities, null, 2);

      var startW = template.indexOf('const DEFAULT_WORKERS = [');
      var endW = template.indexOf('// WORKERS_END', startW);
      var startC = template.indexOf('const DEFAULT_COMMUNITIES = [');
      var endC = template.indexOf('// COMMUNITIES_END', startC);
      if (startW < 0 || endW < 0 || startC < 0 || endC < 0) {
        alert('客户端模板标记缺失，无法注入数据。');
        return;
      }

      var out = template.slice(0, startW)
        + 'const DEFAULT_WORKERS = ' + wJson + ';\n'
        + template.slice(endW, startC)
        + 'const DEFAULT_COMMUNITIES = ' + cJson + ';\n'
        + template.slice(endC);

      // 校验注入后的文件仍是合法 HTML（粗查：script 闭合）
      var scriptCount = (out.match(/<script>/g) || []).length;
      var scriptClose = (out.match(/<\/script>/g) || []).length;
      if (scriptCount !== scriptClose) {
        alert('导出失败：模板脚本标签不匹配。');
        return;
      }

      downloadBlob(out, 'index.html', 'text/html;charset=utf-8');
      appendAudit('导出客户端页面（index.html）');
      showToast('已导出自带最新数据的 index.html');
    }

    function exportJson() {
      var payload = { workers: loadWorkers(), communities: loadCommunities(), exportedAt: new Date().toISOString() };
      downloadBlob(JSON.stringify(payload, null, 2), 'nj-repair-data.json', 'application/json;charset=utf-8');
      appendAudit('导出数据 JSON');
      showToast('已导出数据 JSON');
    }

    function importJson(file) {
      var reader = new FileReader();
      reader.onload = function () {
        try {
          var data = JSON.parse(reader.result);
          var workers = Array.isArray(data.workers) ? data.workers : null;
          var communities = Array.isArray(data.communities) ? data.communities : null;
          if (!workers && !communities) {
            alert('JSON 格式不正确：需要包含 workers / communities 数组');
            return;
          }
          if (workers) saveWorkers(workers);
          if (communities) saveCommunities(communities);
          appendAudit('导入 JSON 数据');
          renderAdminMain();
          showToast('数据导入成功');
        } catch (e) {
          alert('JSON 解析失败：' + e.message);
        }
      };
      reader.readAsText(file, 'utf-8');
    }

    function restoreDefaults() {
      if (!confirm('确认恢复默认数据？当前数据将被覆盖。')) return;
      var template = decodeClientTemplate();
      var defaults = extractDefaultsFromTemplate(template);
      if (defaults.workers.length === 0 || defaults.communities.length === 0) {
        alert('无法从模板提取默认数据。');
        return;
      }
      saveWorkers(defaults.workers);
      saveCommunities(defaults.communities);
      appendAudit('恢复默认数据');
      renderAdminMain();
      showToast('已恢复默认数据');
    }

    // ===================== 绑定事件 =====================
    function bindEvents() {
      document.getElementById('createSubmit').addEventListener('click', handleCreate);
      document.getElementById('createPass').addEventListener('input', function () {
        var v = document.getElementById('createPass').value;
        var hint = document.getElementById('createPassHint');
        if (!v) { hint.textContent = ''; return; }
        if (passwordStrengthOk(v)) {
          hint.className = 'hint ok';
          hint.textContent = '密码强度合格';
        } else {
          hint.className = 'hint err';
          hint.textContent = '至少 8 位，需同时包含字母和数字';
        }
      });
      document.getElementById('loginSubmit').addEventListener('click', handleLogin);
      document.getElementById('loginPass').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') handleLogin();
      });
      document.getElementById('logoutBtn').addEventListener('click', logoutAdmin);
      document.getElementById('statsBtn').addEventListener('click', function () {
        window.open('https://v6.51.la/', '_blank', 'noopener');
      });

      document.getElementById('changePwBtn').addEventListener('click', openChangePw);
      document.getElementById('changePwCancel').addEventListener('click', closeChangePw);
      document.getElementById('changePwSave').addEventListener('click', handleChangePw);
      document.getElementById('newPass').addEventListener('input', function () {
        var v = document.getElementById('newPass').value;
        var hint = document.getElementById('newPassHint');
        if (!v) { hint.textContent = ''; return; }
        if (passwordStrengthOk(v)) {
          hint.className = 'hint ok';
          hint.textContent = '密码强度合格';
        } else {
          hint.className = 'hint err';
          hint.textContent = '至少 8 位，需同时包含字母和数字';
        }
      });

      document.getElementById('addWorkerBtn').addEventListener('click', function () { openWorkerForm(null); });
      document.getElementById('workerCancel').addEventListener('click', closeWorkerForm);
      document.getElementById('workerSave').addEventListener('click', saveWorkerFromForm);

      document.getElementById('addCommunityBtn').addEventListener('click', function () { openCommunityForm(null); });
      document.getElementById('communityCancel').addEventListener('click', closeCommunityForm);
      document.getElementById('communitySave').addEventListener('click', saveCommunityFromForm);

      document.getElementById('searchInput').addEventListener('input', function () {
        renderWorkerList();
        renderCommunityList();
      });

      document.getElementById('exportHtmlBtn').addEventListener('click', exportClientPage);
      document.getElementById('exportJsonBtn').addEventListener('click', exportJson);
      document.getElementById('importJsonInput').addEventListener('change', function (e) {
        if (e.target.files && e.target.files[0]) importJson(e.target.files[0]);
        e.target.value = '';
      });
      document.getElementById('restoreBtn').addEventListener('click', restoreDefaults);
    }

    // ===================== 初始化 =====================
    function initAdmin() {
      // 自检：任何用例失败则展示警告（不阻断使用）
      var results = runAuthSelfTest();
      var failed = results.filter(function (r) { return !r.pass; });
      var bar = document.getElementById('selftestBar');
      if (failed.length > 0) {
        bar.classList.remove('hidden');
        bar.classList.add('fail');
        bar.textContent = '⚠ 鉴权自检未通过：' + failed.map(function (f) { return f.name; }).join('、') + '。请勿在正式环境使用此后台。';
      } else {
        bar.classList.remove('hidden', 'fail');
        bar.textContent = '✓ 鉴权自检通过（SHA-256 向量 / UTF-8 / 密码强度 / 恒定时间比较）';
      }

      ensureSeedData();
      bindEvents();
      renderAuthView();
    }

    document.addEventListener('DOMContentLoaded', initAdmin);
  </script>
</body>
</html>
